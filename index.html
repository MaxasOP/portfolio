  <style>
    :root {
      --bg: #f4f1eb;
      --bg-soft: #ebe6dc;
      --surface: rgba(255, 255, 255, 0.76);
      --surface-strong: #ffffff;
      --ink: #11131a;
      --muted: #5e6370;
      --line: rgba(17, 19, 26, 0.12);
      --line-strong: rgba(17, 19, 26, 0.24);
      --accent: #2457ff;
      --accent-2: #0f9d73;
      --accent-3: #1c2030;
      --shadow: 0 24px 55px rgba(17, 19, 26, 0.08);
      --shadow-lift: 10px 10px 0 rgba(17, 19, 26, 0.08);
      --maxw: 1200px;
      --pointer-x: 72%;
      --pointer-y: 18%;
      --mx: 50%;
      --my: 50%;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 5.5rem;
    }

    body {
      font-family: "Instrument Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(800px 500px at 95% 8%, rgba(36, 87, 255, 0.14), transparent 52%),
        radial-gradient(600px 420px at 10% 18%, rgba(15, 157, 115, 0.1), transparent 54%),
        linear-gradient(180deg, #f7f5ef 0%, #ede8de 100%);
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }
